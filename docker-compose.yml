services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////srv/db/tilebuddy.db
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - db_data:/srv/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db_data:
